<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ことみの受験ナビ v2｜横市集中</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#1c2430; --sub:#67748a; --line:#e3e8f0;
  --nav:#1d2a3d; --navink:#aab8cc; --acc:#b45309; --blue:#1d4ed8; --grn:#15803d; --red:#b91c1c;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
header{background:var(--nav);color:#fff;padding:14px 16px 8px}
header h1{margin:0;font-size:18px}
header .sub{color:var(--navink);font-size:12px;margin-top:2px}
nav{background:var(--nav);display:flex;overflow-x:auto;padding:0 8px}
nav button{background:none;border:none;color:var(--navink);padding:10px 12px;font-size:14px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-bottom-color:var(--acc);font-weight:700}
main{max-width:920px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px;color:var(--acc)}
.card h3{margin:14px 0 6px;font-size:14.5px}
.small{font-size:12.5px;color:var(--sub)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:#eef2f8;color:#41506b;margin-right:6px}
.tag.red{background:#fde8e8;color:var(--red)} .tag.grn{background:#e6f4ea;color:var(--grn)} .tag.blu{background:#e7edfd;color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:#f2f5fa;font-size:12.5px}
.cd{display:flex;gap:10px;flex-wrap:wrap}
.cd .b{flex:1;min-width:140px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.cd .n{font-size:26px;font-weight:800}
.cd .l{font-size:12px;color:var(--sub)}
.cd .b.hot{border-color:var(--acc);background:#fff8ef}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px;font-family:inherit;line-height:1.8}
input[type=text],input[type=date],select{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;font-family:inherit}
button.btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
button.btn.gray{background:#5b6b84} button.btn.sm{padding:4px 10px;font-size:12.5px}
.qa{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.qa .qh{display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer;background:#fff}
.qa .qh:hover{background:#f8fafc}
.qa .st{min-width:34px;text-align:center;font-size:12px;border-radius:8px;padding:2px 4px;background:#eef2f8;color:#67748a;cursor:pointer;user-select:none}
.qa .st.s1{background:#fdf1dc;color:#92600a}.qa .st.s2{background:#e6f4ea;color:var(--grn);font-weight:700}
.qa .qt{flex:1;font-size:14px}
.qa .body{display:none;padding:0 12px 12px;border-top:1px dashed var(--line)}
.qa.open .body{display:block}
.hint{background:#f6f8fb;border-radius:8px;padding:9px 11px;font-size:13.5px;margin:9px 0}
.hint b{color:var(--acc)}
.timerbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#tdisp{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;min-width:150px}
#tdisp.warn{color:var(--red)}
.log{border-bottom:1px dashed var(--line);padding:7px 2px;font-size:13.5px;display:flex;gap:8px}
.log .d{color:var(--sub);min-width:88px}
.log button{margin-left:auto}
.phase{border-left:4px solid var(--acc);padding:6px 10px;margin:8px 0;background:#fffdf8}
.phase.now{background:#fff3e0}
ul{margin:6px 0;padding-left:20px} li{margin:3px 0}
.chip{display:inline-block;border:1px solid var(--line);border-radius:16px;padding:2px 10px;font-size:12.5px;margin:2px;cursor:pointer;user-select:none}
.chip.on{background:#e6f4ea;border-color:var(--grn);color:var(--grn);font-weight:700}
a{color:var(--blue)}
.notice{background:#fde8e8;border:1px solid #f5b5b5;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
</style>
</head>
<body>
<header>
  <h1>ことみの受験ナビ v2 <span style="font-size:12px;color:#e8b06b">横市集中版</span></h1>
  <div class="sub">第一志望：横浜市立大学 総合型選抜（二次 10/10）／ 第二志望：横市 海外帰国生（10/3）　APP_VERSION <span id="ver"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
"use strict";
const APP_VERSION="2026.09.22-v2";
const KEY="kotomiNavi_v2";
const GH_TOKEN_KEY="kotomiNavi_ghToken", GH_GIST_KEY="kotomiNavi_gistId", GIST_FILE="kotomi-navi-v2.json"; // トークン・GistIDは旧版と共用

/* ---------- state ---------- */
let S={script:"",poster:"",qa:{},qamemo:{},themes:{},logs:[],essays:[],notes:""};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{localStorage.setItem(KEY,JSON.stringify(S));},300);}

/* ---------- events ---------- */
const EV=[
["2026-09-24","明治学院：一次出願締切（Web23:59／郵送消印有効）","出願","red"],
["2026-09-25","横市総合型：一次選考（書類）結果発表","横市","red"],
["2026-09-25","横市帰国生：受験票 郵送（〜この日まで）","横市",""],
["2026-10-01","上智：合格発表 10:00（マイページ「合否結果」）","上智","blu"],
["2026-10-03","横市帰国生：試験日 9:10集合（金沢八景）小論文9:30-11:00／面接13:00-17:00","横市","red"],
["2026-10-10","横市総合型：二次選考（個人面接30分＝発表10分＋質疑20分）","横市","red"],
["2026-10-15","上智：入学手続締切（消印有効）※押さえるなら納入判断","上智","blu"],
["2026-10-21","明治学院：一次結果発表 10:00（UCARO）／二次出願 10/21〜10/28","明学",""],
["2026-10-28","明治学院：二次出願締切（Web＋15,000円）","明学",""],
["2026-11-02","横市：合格発表 10:00（総合型・帰国生とも／受験生ポータル）","横市","red"],
["2026-11-06","明治学院：受験票 各自印刷（UCARO）","明学",""],
["2026-11-15","明治学院：二次選考（白金 9:30集合／小論文10:00-11:00・面接13:00〜）","明学",""],
["2026-12-04","明治学院：合格発表 10:00","明学",""],
["2026-12-11","明治学院：入学手続締切（消印）","明学",""],
["2026-12-18","横市：入学手続日（金沢八景／郵送はこの日必着）","横市",""],
["2026-12-31","横国：12月受験（正確な日程・要項は要確認）","横国",""],
];
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
function days(ds){const t=today(),e=new Date(ds+"T00:00:00");return Math.round((e-t)/86400000);}

/* ---------- 想定問答 ---------- */
const QA=[
["A. 書類・体験の深掘り","ボランティア活動の内容を1分で説明してください","母校主催・1週間・小学校で英語の基礎・放課後に貧困家庭へ食料と対話。結論→中身の順で短く。"],
["A. 書類・体験の深掘り","ジュリアさんのことを詳しく教えてください","目の病気・治療費が出せない家庭。それでも「学校に通えることが幸せ」と語り不満を言わなかった。憐れみではなく、彼女の尊厳と強さを語ること。"],
["A. 書類・体験の深掘り","「必要な医療費」とは、どんな病気だったのですか","目の病気。医療も教育も、同じ「アクセスの不平等」という構造にある、と一言でつなげられると強い。"],
["A. 書類・体験の深掘り","出会った子どもたちの母語は何でしたか","スペイン語。マヤ諸語を話す子どもたちのことは帰国後に調べて知った、と正直に。"],
["A. 書類・体験の深掘り","帰国後、何で調べましたか。読んだ本は？","実際に読んだ本・記事の題名を2つ言えるように準備。坪谷先生の論文か上村先生の新書を1冊読んでおくと万全。"],
["A. 書類・体験の深掘り","そのプログラムの主催はどんな団体ですか","母校（米国の高校）の主催。事実のまま簡潔に。聞かれたことだけ答える。"],
["A. 書類・体験の深掘り","「支援する側の思い込み」とは何ですか","相手の言葉・歴史を知らないまま「与える側」に立ち、自分の価値観を押し付けること。自分の失敗として語る。"],
["A. 書類・体験の深掘り","では、支援はしない方がよいのですか","不要ではない。相手の文脈を知り、同じ目線で行う支援へ。だから仕組みを学びに大学へ行く、と返す。"],
["B. 発表への追撃","発表で一番伝えたかったことは何ですか","事前に一文で決めておく（例：壁は個人の努力の問題とは限らず、仕組みを学ばなければ寄り添えない）。"],
["B. 発表への追撃","あなたの弱みは何だと思いますか","正直に一つ＋それへの対処をセットで。取り繕わない。"],
["B. 発表への追撃","「言葉の壁の内側にいた」経験をもう少し詳しく","ホストファミリーとの食卓の沈黙→相手の立場で考えた→自分から話しかけた→関係が変わった。転機の物語をいつでも2分で話せるように。"],
["C. 志望・併願","なぜ横浜市立大学なのですか","グローカル（世界の課題が横浜の足元にある）・現場のフィールドワーク・文理融合・複言語。標語に触れてもよい。"],
["C. 志望・併願","他の大学は受けていますか","正直に。そのうえで「総合型が第一志望。合格したら入学します」と確約と整合する答えを明確に。"],
["C. 志望・併願","なぜ国際教養学部なのですか","将来の職業がまだ一つに定まっていないからこそ、幅広い学問と現場の両方に触れて見極めたい、という論理。"],
["C. 志望・併願","オープンキャンパスには来ましたか","事実のまま。行っていなければ、調べたこと（新課程・教員の研究）で補う。"],
["D. 学びの構想","ドメインは2つありますが、もう一方の名前を知っていますか","「人文学・メディアリテラシー」。即答できると調査の深さが伝わる。"],
["D. 学びの構想","坪谷先生の研究をどこまで知っていますか","外国につながる子どもの教育と母語・多文化共生。神奈川県立鶴見総合高校に16年関わり、団地の外国人住民の研究も。論文名を1本言えると強い。"],
["D. 学びの構想","データサイエンスで何を確かめたいのですか","例：外国につながる子どもの就学状況や日本語支援の分布。GIS＝地理情報システム（地図にデータを重ねる）と説明できるように。"],
["D. 学びの構想","スペイン語を学んで何をしたいですか","中南米の当事者の声に直接触れる。ジュリアと自分の言葉で話したい、という具体でもよい。"],
["D. 学びの構想","横浜のどの地域を想定していますか","鶴見区など外国につながる住民の多い地域。JICA横浜のような機関名も一つ言えるとよい。"],
["E. 基礎知識","グアテマラはどこにあり、隣国はどこですか","中米。メキシコ・ベリーズ・ホンジュラス・エルサルバドル。ホンジュラス・エルサルバドルと合わせ「北部三角地帯」＝米国への移民が多い地域。"],
["E. 基礎知識","マヤ諸語はいくつくらいあるか知っていますか","グアテマラには22のマヤ系言語（キチェ語など）。数字を一つ持っておく。"],
["E. 基礎知識","グアテマラ内戦について知っていますか","1960〜96年の内戦。マヤ先住民に多くの犠牲。1996年和平合意。差別の歴史の核心として1分で。"],
["E. 基礎知識","日本の「外国につながる子ども」の課題を知っていますか","不就学の問題、日本語指導が必要な児童生徒の増加。外国人には就学義務が適用されない、という制度の話まで言えると強い。"],
["E. 基礎知識","「多文化共生」とはどういう意味だと思いますか","定義暗記でなく自分の言葉で。「助ける／助けられる」でなく対等な関係、という書類の主張と一貫させる。"],
["F. 将来・締め","将来はどんな職業に就きたいですか","「まだ一つに定まっていない。ただ、不利な立場の人の側に立ち続ける方向は決まっている。それを見極める4年間にしたい」。堂々と。"],
["F. 将来・締め","4年間で答えが見つからなかったらどうしますか","探し続ける姿勢＋大学で身につく力（調査力・言語・データ）はどの道でも生きる、と前向きに。"],
["F. 将来・締め","最後に何か質問はありますか","逆質問を2つ準備（例：リテラシーゼミの地域調査の実例／新課程1期生としての機会）。「ありません」は避ける。"],
];

/* ---------- 帰国生 予想テーマ ---------- */
const THEMES=[
"多文化共生：外国につながる人々と地域社会はどう共に生きるか",
"移民と教育：言葉の壁と学ぶ権利",
"AIと人間：技術の進歩は人の幸福につながるか",
"格差と貧困：豊かさの中の不平等をどう考えるか",
"都市の課題：国際都市・横浜のこれから",
"ジェンダー：「当たり前」を疑う視点",
"国際協力：援助は誰のためのものか",
"言語と社会：母語で学べないということ",
];

/* ---------- tabs ---------- */
const TABS=[["home","ホーム"],["niji","二次対策 10/10"],["qa","想定問答"],["kikoku","帰国生 10/3"],["cal","予定表"],["log","記録"],["set","設定"]];
let cur="home";
function nav(){document.getElementById("nav").innerHTML=TABS.map(t=>`<button class="${cur===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join("");}
function go(t){cur=t;nav();render();window.scrollTo(0,0);}

/* ---------- render ---------- */
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function render(){
const m=document.getElementById("main");
if(cur==="home") m.innerHTML=vHome();
else if(cur==="niji") m.innerHTML=vNiji();
else if(cur==="qa") m.innerHTML=vQA();
else if(cur==="kikoku") m.innerHTML=vKikoku();
else if(cur==="cal") m.innerHTML=vCal();
else if(cur==="log") m.innerHTML=vLog();
else if(cur==="set") m.innerHTML=vSet();
afterRender();
}

function vHome(){
const cds=[["2026-09-25","一次結果発表(総合型)"],["2026-10-03","帰国生 試験"],["2026-10-10","総合型 二次"],["2026-11-02","横市 合格発表"]];
const cd=cds.map(c=>{const d=days(c[0]);if(d<0)return"";return `<div class="b ${d<=7?'hot':''}"><div class="n">${d===0?"今日":"あと"+d+"日"}</div><div class="l">${c[1]}<br>${c[0].slice(5).replace("-","/")}</div></div>`;}).join("");
const t=today(); const ph=(a,b)=>{const s=new Date(a+"T00:00:00"),e=new Date(b+"T23:59:59");return t>=s&&t<=e;};
return `
<div class="cd">${cd}</div>
<div class="card"><h2>出願・受験ステータス</h2>
<table>
<tr><th>大学・方式</th><th>位置づけ</th><th>状況・次の予定</th></tr>
<tr><td><b>横市 総合型選抜</b></td><td><span class="tag red">第一志望</span></td><td>一次結果 9/25 →（通過なら）二次 10/10。<b>このアプリのメイン</b></td></tr>
<tr><td><b>横市 海外帰国生</b></td><td><span class="tag red">第二志望</span></td><td>出願済み。試験 10/3（小論文＋面接）</td></tr>
<tr><td>上智 FGS</td><td><span class="tag blu">受験済み</span></td><td>9/20受験完了。発表 10/1・手続締切 10/15（押さえ判断）</td></tr>
<tr><td>明治学院 国際AO(B)</td><td><span class="tag">滑り止め</span></td><td>出願手続中（締切 9/24）。一次発表 10/21</td></tr>
<tr><td>横国</td><td><span class="tag">12月</span></td><td>12月受験。横市決着後に準備再開（要項要確認）</td></tr>
</table></div>
<div class="card"><h2>今の作戦（3つの局面）</h2>
<div class="phase ${ph('2026-09-22','2026-09-25')?'now':''}"><b>〜9/25（一次発表まで）</b>：発表台本v1を書く／ポスター案／想定問答A・B（書類の深掘り）を口頭練習。明学出願を完了（9/24）。</div>
<div class="phase ${ph('2026-09-26','2026-10-03')?'now':''}"><b>9/26〜10/3（帰国生試験まで）</b>：帰国生タブの予想テーマで小論文90分練習（2〜3本、Claudeに送って講評）／面接は想定問答で兼用。10/1 上智発表を確認。</div>
<div class="phase ${ph('2026-10-04','2026-10-10')?'now':''}"><b>10/4〜10/10（二次まで）</b>：発表を毎日通し練習（録音→聞き直し）／質疑20分の模擬を家族相手に最低3回／ポスター完成・持ち物確認。</div>
</div>
<div class="card"><h2>メモ</h2><textarea id="homeNotes" rows="4" placeholder="なんでもメモ">${esc(S.notes)}</textarea></div>`;
}

function vNiji(){
const len=(S.script||"").replace(/\s/g,"").length;
return `
<div class="notice"><b>二次選考の形式（要項確認済み）</b>：個人面接30分程度＝<b>発表10分＋質疑20分</b>。ホワイトボード（180×90cm）使用可・ポスター等の掲示物可・<b>PC不可</b>・資料の配付や提出は不可（提示は可）。発表・質疑とも日本語。</div>

<table>

<tr><td>6:00-9:00</td><td>計画：入学後の4つの学び（ドメイン／フィールドワーク／データ／スペイン語）</td><td>概要2</td></tr>
<tr><td>9:00-10:00</td><td>結び：目指す社会と「自分から歩み寄る」宣言</td><td>概要2 結び</td></tr>
</table>
<div class="small" style="margin-top:6px">目安：話す速さは1分あたり約300字。10分＝約3,000字。台本は2,700〜2,900字がちょうどよい。</div>
<h3>ポスター（4ブロック案）</h3>
<ul><li>①問い（課題名を大きく）　②グアテマラで見たこと（ジュリア）　③調べて分かった仕組み（選べない壁）　④横市での4つの学び</li>
<li>紙のポスターを事前に作って持参（配付は不可・提示は可）。写真や地図も貼ってよい。文字は後ろの席から読める大きさで。</li></ul>
<textarea id="poster" rows="4" placeholder="ポスターの構成メモ">${esc(S.poster)}</textarea>
</div>
<div class="card"><h2>発表台本 <span class="small">（<span id="slen">${len}</span>字 ≒ <span id="smin">${(len/300).toFixed(1)}</span>分）</span></h2>
<textarea id="script" rows="16" placeholder="ここに台本を書く（自動保存）">${esc(S.script)}</textarea>
</div>
<div class="card"><h2>練習タイマー</h2>
<div class="timerbox">
<div id="tdisp">10:00</div>
<button class="btn" onclick="tSet(600)">発表10分</button>
<button class="btn" onclick="tSet(1200)">質疑20分</button>
<button class="btn gray" onclick="tSet(1800)">通し30分</button>
<button class="btn" id="tgo" onclick="tGo()">スタート</button>
<button class="btn gray" onclick="tReset()">リセット</button>
</div>
<div class="small">練習のコツ：スマホで録音→聞き直す。台本を見ずに話せるまで繰り返す。質疑練習は家族が「想定問答」タブから無作為に質問。</div>
</div>`;
}

function vQA(){
let cat="",h="";
QA.forEach((q,i)=>{
  if(q[0]!==cat){cat=q[0];h+=`<h3 style="margin:16px 0 8px">${cat}</h3>`;}
  const st=S.qa[i]||0, cls=st===1?"s1":st===2?"s2":"", lab=st===1?"△":st===2?"◎":"未";
  h+=`<div class="qa" id="qa${i}">
  <div class="qh"><span class="st ${cls}" onclick="qaSt(event,${i})">${lab}</span><span class="qt" onclick="qaTg(${i})">${q[1]}</span></div>
  <div class="body"><div class="hint"><b>答えの軸：</b>${q[2]}</div>
  <textarea rows="2" placeholder="自分の言葉でメモ" oninput="S.qamemo[${i}]=this.value;save()">${esc(S.qamemo[i])}</textarea></div></div>`;
});
const done=Object.values(S.qa).filter(v=>v===2).length;
return `<div class="card"><h2>想定問答 28問 <span class="small">◎=自分の言葉で言える（${done}/${QA.length}）。マークをタップで 未→△→◎</span></h2>
<div class="small">使い方：質問をタップ→「答えの軸」を読む→<b>声に出して</b>答える→自分の言葉をメモ。台本の丸暗記はしない（軸だけ覚えて毎回言い方を変える）。帰国生10/3の面接（調書ベース）も、この問答で兼用できます。</div>
${h}</div>`;
}

function vKikoku(){
let th="";
THEMES.forEach((t,i)=>{
th+=`<div class="qa" id="th${i}"><div class="qh"><span class="qt" onclick="qaTg('h${i}','th${i}')">${i+1}. ${t}</span></div>
<div class="body"><textarea rows="3" placeholder="構成メモ（主張／理由／具体例＝自分の経験）" oninput="S.themes[${i}]=this.value;save()">${esc(S.themes[i])}</textarea></div></div>`;});
return `
<div class="notice"><b>10/3（土）当日</b>：9:10集合・金沢八景キャンパス。小論文 9:30〜11:00（90分）／面接 13:00〜17:00（当日発表の時間割で随時）。<b>受験票（郵送されたもの）を必ず持参</b>。面接終了が何時になるか分からないので一日空けておく。</div>
<div class="card"><h2>小論文の傾向と構え</h2>
<ul>
<li>要項の記載：「<b>人文科学・社会科学分野に関する課題</b>を提示し、問題意識、理解力、表現力などを総合的に評価」。</li>
<li>構成の型はこれまで通り：<b>課題文の核心を受ける → 主張 → 理由と仕組み → 自分の経験（グアテマラ／留学）で具体化 → 反対側にも触れる → 結論</b>。</li>
<li>配点は小論文100＋面接100。英語加点（90点〜）は無いので、<b>小論文と面接で勝負</b>。</li>
<li>練習答案はこれまで通り写真でClaudeへ →「検品→減点明細→添削→宿題」の講評 → 記録タブに点数を記録。</li>
</ul>
<h3>予想テーマ8本（タップして構成メモ）</h3>${th}
</div>
<div class="card"><h2>面接（調書ベース）</h2>
<div class="small">評価軸：志望動機・関心分野・将来の進路／学習意欲・理解力・表現力。<b>「想定問答」タブの28問がそのまま使えます</b>（提出した志願者調書の内容＝ジュリア・転機・二つの学び・標語）。</div>
<h3>持ち物チェック</h3>
<ul><li>受験票（郵送分）／筆記用具・腕時計（スマホ不可想定）／昼食（面接まで長い待ち時間）／読みかけの本（待ち時間用・面接の話題にもなる）</li></ul>
</div>`;
}

function vCal(){
const rows=EV.map(e=>{const d=days(e[0]);const past=d<0;
return `<tr style="${past?'opacity:.45':''}"><td>${e[0].slice(5).replace("-","/")}</td><td>${past?"済":d===0?"<b>今日</b>":"あと"+d+"日"}</td><td><span class="tag ${e[3]}">${e[2]}</span>${e[1]}</td></tr>`;}).join("");
return `<div class="card"><h2>予定表（全体）</h2><table><tr><th style="width:64px">日付</th><th style="width:70px">残り</th><th>予定</th></tr>${rows}</table>
<div class="small" style="margin-top:8px">※横国の12月日程と上智の入学手続の要否判断（10/15）は、状況が動いたらClaudeに相談して更新。</div></div>`;
}

function vLog(){
const list=(S.logs||[]).slice().reverse().map((l,ri)=>{const i=S.logs.length-1-ri;
return `<div class="log"><span class="d">${l.d}</span><span class="tag">${l.t}</span><span>${esc(l.m)}</span><button class="btn sm gray" onclick="delLog(${i})">削除</button></div>`;}).join("")||"<div class='small'>まだ記録がありません</div>";
return `<div class="card"><h2>練習・採点の記録</h2>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
<input type="date" id="ld" value="${new Date().toISOString().slice(0,10)}">
<select id="lt"><option>発表練習</option><option>質疑練習</option><option>小論文</option><option>面接練習</option><option>その他</option></select>
<input type="text" id="lm" placeholder="メモ（例：小論文 テーマ2 22/30 講評済）" style="flex:1;min-width:200px">
<button class="btn" onclick="addLog()">追加</button></div>
${list}</div>`;
}

function vSet(){
return `<div class="card"><h2>データ同期（Gist）</h2>
<div class="small">旧版と同じトークン・Gist IDを共用します（保存ファイル名は別なので旧版データは壊れません）。</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">
<input type="text" id="ghtoken" placeholder="GitHubトークン" value="${esc(localStorage.getItem(GH_TOKEN_KEY)||"")}" style="flex:1;min-width:200px">

</div>

<span id="gmsg" class="small"></span></div>

<label class="btn gray" style="display:inline-block">インポート<input type="file" accept=".json" style="display:none" onchange="impJson(this)"></label></div>
<div class="card"><h2>旧版（上智対策版）</h2>
<div class="small">これまでの50本ノート・採点記録・事例カードはすべて旧版に残っています。データも独立して保持されます。</div>
<p><a href="./旧版_上智対策_index.html">→ 旧版を開く</a>（GitHubにも同じファイル名でアップロードすれば公開URLでも開けます）</p></div>
<div class="card"><h2>バージョン</h2><div class="small">${APP_VERSION}／切替日 2026-09-22／第一志望=横市総合型・第二志望=横市帰国生</div></div>`;

/* ---------- behaviors ---------- */
function afterRender(){
const sc=document.getElementById("script");
if(sc){sc.addEventListener("input",()=>{S.script=sc.value;save();
const len=sc.value.replace(/\s/g,"").length;
document.getElementById("slen").textContent=len;
document.getElementById("smin").textContent=(len/300).toFixed(1);});}
const po=document.getElementById("poster");
if(po){po.addEventListener("input",()=>{S.poster=po.value;save();});}
const hn=document.getElementById("homeNotes");
if(hn){hn.addEventListener("input",()=>{S.notes=hn.value;save();});}
document.getElementById("ver").textContent=APP_VERSION;
}
function qaTg(i,elid){const el=document.getElementById(elid||("qa"+i));if(el)el.classList.toggle("open");}
function qaSt(ev,i){ev.stopPropagation();S.qa[i]=((S.qa[i]||0)+1)%3;save();render();}
function addLog(){const d=document.getElementById("ld").value,t=document.getElementById("lt").value,m=document.getElementById("lm").value.trim();
if(!m){alert("メモを入力してください");return;}
S.logs.push({d,t,m});save();render();}
function delLog(i){if(confirm("削除しますか？")){S.logs.splice(i,1);save();render();}}

/* ---------- timer ---------- */
let tSec=600,tRun=null,tCount=600,tMode="down";
function tFmt(s){const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");}
function tShow(){const d=document.getElementById("tdisp");if(!d)return;d.textContent=tFmt(tCount);d.className=tCount<=60?"warn":"";d.id="tdisp";}
function tSet(s){tStop();tSec=s;tCount=s;tShow();}
function tGo(){if(tRun){tStop();return;}
document.getElementById("tgo").textContent="一時停止";
tRun=setInterval(()=>{tCount--;if(tCount<=0){tStop();tCount=0;tShow();document.title="⏰ 時間です";alert("時間です");return;}tShow();},1000);}
function tStop(){clearInterval(tRun);tRun=null;const b=document.getElementById("tgo");if(b)b.textContent="スタート";}
function tReset(){tStop();tCount=tSec;tShow();}

/* ---------- gist sync ---------- */
async function gistSave(){
const tk=document.getElementById("ghtoken").value.trim(),id=document.getElementById("ghgist").value.trim(),msg=document.getElementById("gmsg");
if(!tk||!id){msg.textContent="トークンとGist IDを入力";return;}
localStorage.setItem(GH_TOKEN_KEY,tk);localStorage.setItem(GH_GIST_KEY,id);
msg.textContent="保存中…";
try{const r=await fetch("https://api.github.com/gists/"+id,{method:"PATCH",headers:{Authorization:"token "+tk,"Content-Type":"application/json"},body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(S)}}})});
msg.textContent=r.ok?"✓ 保存しました "+new Date().toLocaleTimeString():"エラー: "+r.status;}catch(e){msg.textContent="通信エラー";}}
async function gistLoad(){
const tk=document.getElementById("ghtoken").value.trim(),id=document.getElementById("ghgist").value.trim(),msg=document.getElementById("gmsg");
if(!tk||!id){msg.textContent="トークンとGist IDを入力";return;}
localStorage.setItem(GH_TOKEN_KEY,tk);localStorage.setItem(GH_GIST_KEY,id);
msg.textContent="読込中…";
try{const r=await fetch("https://api.github.com/gists/"+id,{headers:{Authorization:"token "+tk}});
if(!r.ok){msg.textContent="エラー: "+r.status;return;}
const j=await r.json();const f=j.files&&j.files[GIST_FILE];
if(!f){msg.textContent="Gist内にv2データがまだありません（初回は先に保存を）";return;}
S=Object.assign(S,JSON.parse(f.content));localStorage.setItem(KEY,JSON.stringify(S));
msg.textContent="✓ 読み込みました";render();}catch(e){msg.textContent="通信エラー";}}

/* ---------- export/import ---------- */
function expJson(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="kotomi-navi-v2-backup.json";a.click();}
function impJson(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{S=Object.assign(S,JSON.parse(rd.result));localStorage.setItem(KEY,JSON.stringify(S));render();alert("読み込みました");}catch(e){alert("読み込み失敗");}};rd.readAsText(f);}

nav();render();
</script>
