}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}

<script>
"use strict";
const APP_VERSION="2026.09.23-v2.9.1";
const KEY="kotomiNavi_v2";
const GH_TOKEN_KEY="kotomiNavi_ghToken", GH_GIST_KEY="kotomiNavi_gistId", GIST_FILE="kotomi-navi-v2.json"; // トークン・GistIDは旧版と共用

/* ---------- state ---------- */
let S={script:"",poster:"",qa:{},qamemo:{},themes:{},themeChk:{},logs:[],notes:"",mock:{sets:[],used:{},sel:{}}};
try{const raw=localStorage.getItem(KEY); if(raw){const o=JSON.parse(raw);S=Object.assign(S,o);S.mock=Object.assign({sets:[],used:{},sel:{}},o.mock||{});}}catch(e){}
let saveT=null;
function save(){S._ts=Date.now();clearTimeout(saveT);saveT=setTimeout(()=>{localStorage.setItem(KEY,JSON.stringify(S));schedulePush();},300);}

/* ---------- 自動同期 ---------- */
function creds(){return {tk:localStorage.getItem(GH_TOKEN_KEY)||"",id:localStorage.getItem(GH_GIST_KEY)||""};}
let pushT=null;
function schedulePush(){const c=creds();if(!c.tk||!c.id)return;clearTimeout(pushT);pushT=setTimeout(()=>{gistPush();},4000);}
function syncMark(t){const el=document.getElementById("sync");if(el)el.textContent=t||("同期✓ "+new Date().toTimeString().slice(0,5));}
async function gistPush(){const c=creds();if(!c.tk||!c.id)return false;
try{const r=await fetch("https://api.github.com/gists/"+c.id,{method:"PATCH",headers:{Authorization:"token "+c.tk,"Content-Type":"application/json"},body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(S)}}})});
if(r.ok){syncMark();return true;}syncMark("同期エラー");}catch(e){syncMark("通信エラー");}return false;}
async function initSync(){const c=creds();if(!c.tk||!c.id)return;
try{const r=await fetch("https://api.github.com/gists/"+c.id,{headers:{Authorization:"token "+c.tk}});
if(!r.ok)return;const j=await r.json();const f=j.files&&j.files[GIST_FILE];if(!f||!f.content)return;
const o=JSON.parse(f.content);
if((o._ts||0)>(S._ts||0)){S=Object.assign(S,o);S.mock=Object.assign({sets:[],used:{},sel:{}},o.mock||{});localStorage.setItem(KEY,JSON.stringify(S));render();syncMark("最新を取得✓");}
else if((S._ts||0)>(o._ts||0)){gistPush();}
else{syncMark();}
}catch(e){}}

/* ---------- events ---------- */
const EV=[
["2026-09-24","明治学院：一次出願締切（Web23:59／郵送消印有効）","出願","red"],
["2026-09-25","横市総合型：一次選考（書類）結果発表","横市","red"],
["2026-09-25","横市帰国生：受験票 郵送（〜この日まで）","横市",""],
["2026-10-01","上智：合格発表 10:00（マイページ「合否結果」）","上智","blu"],
["2026-10-01","横国B(ソクラテス)：検定料払込開始（〜10/13・コンビニ）※Bルート選択時","横国",""],
["2026-10-03","横市帰国生：試験日 9:10集合（金沢八景）小論文9:30-11:00／面接13:00-17:00","横市","red"],
["2026-10-07","横国B(ソクラテス)：出願開始（〜10/13 17時・完全オンライン）※Bルート選択時","横国","red"],
["2026-10-10","横市総合型：二次選考（個人面接30分＝発表10分＋質疑20分）","横市","red"],
["2026-10-13","横国B(ソクラテス)：出願締切 17時（SAT直送もこの日必着）","横国","red"],
["2026-10-15","上智：入学手続締切（消印有効）※押さえるなら納入判断","上智","blu"],
["2026-10-21","横国A(経営)：出願はじまる（〜10/27必着・郵送のみ・様式PDF印刷・志望理由書自筆）※Aルート選択時","横国","red"],
["2026-10-21","明治学院：一次結果発表 10:00（UCARO）／二次出願 10/21〜10/28","明学",""],
["2026-10-27","横国A(経営)：出願締切【必着】（国内書留は10/26消印まで救済あり）","横国","red"],
["2026-10-28","明治学院：二次出願締切（Web＋15,000円）","明学",""],
["2026-11-02","横市：合格発表 10:00（総合型・帰国生とも／受験生ポータル）","横市","red"],
["2026-11-06","明治学院：受験票 各自印刷（UCARO）","明学",""],
["2026-11-11","横国B(ソクラテス)：1次（書類）合格発表","横国",""],
["2026-11-15","明治学院：二次選考（白金 9:30集合／小論文10:00-11:00・面接13:00〜）","明学",""],
["2026-11-19","横国B(ソクラテス)：口頭試問 11/19〜20（Zoom・英語30分・スライド1枚プレゼン）","横国","red"],
["2026-12-04","明治学院：合格発表 10:00","明学",""],
["2026-12-07","横国A(経営)：試験日（常盤台）小論文10:00-11:00（社会科学テーマ・日本語）／面接12:00〜","横国","red"],
["2026-12-09","横国B(ソクラテス)：最終合格発表（入学手続 12/10〜22）","横国","red"],
["2026-12-11","明治学院：入学手続締切（消印）","明学",""],
["2026-12-17","横国A(経営)：合格発表 12:00頃（Web掲載＋郵送）","横国","red"],
["2026-12-18","横市：入学手続日（金沢八景・持参可）※横国12/17発表を見て翌日に判断できる","横市",""],
["2026-12-24","横国A(経営)：入学手続締切（12/18〜24）","横国",""],
];
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
function days(ds){const t=today(),e=new Date(ds+"T00:00:00");return Math.round((e-t)/86400000);}

/* ---------- 想定問答（★=教授指摘の追加想定） ---------- */
const QA=[
["A. 書類・体験の深掘り","ボランティア活動の内容を1分で説明してください","母校主催・1週間・小学校で英語の基礎・放課後に貧困家庭へ食料と対話。結論→中身の順で短く。",0],
["A. 書類・体験の深掘り","この活動が事実であることを示せますか（いつ・どこで・誰と）","★慌てない。最大の証明は細部の即答：訪れた町の名前・滞在日程・引率の先生・一緒に行った人数・泊まった場所。写真や母校の記録も「あります。必要ならお見せできます」。写真をポスターに入れておくのも有効（提示は可）。",1],
["A. 書類・体験の深掘り","母校（LCS）はこの活動をどういう位置づけで行っているのですか","★母校の毎年のプログラムとしての目的（奉仕活動・国際経験）、希望者参加か全員か、現地の受け入れ先、引率体制を親子で事実確認して即答できるように。キリスト教系の学校の奉仕教育の一環という事実はそのまま話してよい。",1],
["A. 書類・体験の深掘り","ジュリアさんのことを詳しく教えてください","目の病気・治療費が出せない家庭。それでも「学校に通えることが幸せ」と語り不満を言わなかった。憐れみではなく、彼女の尊厳と強さを語ること。",0],
["A. 書類・体験の深掘り","「必要な医療費」とは、どんな病気だったのですか","目の病気。医療も教育も、同じ「アクセスの不平等」という構造にある、と一言でつなげられると強い。",0],
["A. 書類・体験の深掘り","出会った子どもたちの母語は何でしたか","スペイン語。マヤ諸語を話す子どもたちのことは帰国後に調べて知った、と正直に。",0],
["A. 書類・体験の深掘り","帰国後、何で調べましたか。読んだ本は？","実際に読んだ本・記事の題名を2つ言えるように準備。坪谷先生の論文か上村先生の新書を1冊読んでおくと万全。",0],
["A. 書類・体験の深掘り","「支援する側の思い込み」とは何ですか","相手の言葉・歴史を知らないまま「与える側」に立ち、自分の価値観を押し付けること。自分の失敗として語る。",0],
["A. 書類・体験の深掘り","では、支援はしない方がよいのですか","不要ではない。相手の文脈を知り、同じ目線で行う支援へ。だから仕組みを学びに大学へ行く、と返す。",0],
["B. 書類・発表への追撃","書類の作成にAIを使いましたか","★正直に、堂々と。軸：①経験・考え・最終的な言葉はすべて自分のもの ②AIは調べ物の整理や文章の推敲の相談相手として使い、直す・直さないの判断は自分でした ③これは学部が掲げる「AIを道具として使いこなし、判断は人間が行う」学びの実践だと考えている。最良の証明は、書類の中身を何も見ずに自分の言葉で語れること——この練習アプリ全体がそのための準備。卑屈にならない、隠さない、盛らない。",1],
["B. 書類・発表への追撃","発表で一番伝えたかったことは何ですか","事前に一文で決めておく（例：壁は個人の努力の問題とは限らず、仕組みを学ばなければ寄り添えない）。",0],
["B. 書類・発表への追撃","あなたの弱みは何だと思いますか","正直に一つ＋それへの対処をセットで。取り繕わない。",0],
["B. 書類・発表への追撃","「言葉の壁の内側にいた」経験をもう少し詳しく","ホストファミリーとの食卓の沈黙→相手の立場で考えた→自分から話しかけた→関係が変わった。転機の物語をいつでも2分で話せるように。",0],
["C. 志望・併願","なぜ横浜市立大学なのですか","グローカル（世界の課題が横浜の足元にある）・現場のフィールドワーク・文理融合・複言語。標語に触れてもよい。",0],
["C. 志望・併願","他の大学は受けていますか","正直に。そのうえで「総合型が第一志望。合格したら入学します」と確約と整合する答えを明確に。",0],
["C. 志望・併願","なぜ国際教養学部なのですか","将来の職業がまだ一つに定まっていないからこそ、幅広い学問と現場の両方に触れて見極めたい、という論理。",0],
["C. 志望・併願","オープンキャンパスには来ましたか","事実のまま。行っていなければ、調べたこと（新課程・教員の研究）で補う。",0],
["D. 学びの構想","ドメインは2つありますが、もう一方の名前を知っていますか","「人文学・メディアリテラシー」。即答できると調査の深さが伝わる。",0],
["D. 学びの構想","坪谷先生の研究をどこまで知っていますか","外国につながる子どもの教育と母語・多文化共生。神奈川県立鶴見総合高校に16年関わり、団地の外国人住民の研究も。論文名を1本言えると強い。",0],
["D. 学びの構想","書類に名前を挙げた先生が担当でなくなったらどうしますか","★「先生個人ではなく、領域を学びに来ます」。お名前は関心を具体化するために挙げたもので、志望の核は多文化共生・グローカルという領域と、横浜という現場。担当の先生が替わっても学びたいことは変わらない、と即答。新課程でゼミ構成が変わりうることも承知していると添えられれば完璧。",1],
["D. 学びの構想","フィールドワークは何語で、どのように行うのですか","★横浜での調査は日本語が中心（相手に応じて、やさしい日本語や英語も）。方法は、支援の場に通って話を聞くこと（聞き取り・インタビュー）、活動への参加、アンケートやデータとの突き合わせ。「相手の言葉で聞く」ことを大切にしたいから、スペイン語も学ぶ——将来は中南米での調査もその言葉で、とつなげる。",1],
["D. 学びの構想","データサイエンスで何を確かめたいのですか","例：外国につながる子どもの就学状況や日本語支援の分布。GIS＝地理情報システム（地図にデータを重ねる）と説明できるように。",0],
["D. 学びの構想","スペイン語を学んで何をしたいですか","中南米の当事者の声に直接触れる。ジュリアと自分の言葉で話したい、という具体でもよい。",0],
["D. 学びの構想","横浜のどの地域を想定していますか","鶴見区など外国につながる住民の多い地域。JICA横浜のような機関名も一つ言えるとよい。",0],
["E. 基礎知識","グアテマラはどこにあり、隣国はどこですか","中米。メキシコ・ベリーズ・ホンジュラス・エルサルバドル。ホンジュラス・エルサルバドルと合わせ「北部三角地帯」＝米国への移民が多い地域。",0],
["E. 基礎知識","マヤ諸語はいくつくらいあるか知っていますか","グアテマラには22のマヤ系言語（キチェ語など）。数字を一つ持っておく。",0],
["E. 基礎知識","グアテマラ内戦について知っていますか","1960〜96年の内戦。マヤ先住民に多くの犠牲。1996年和平合意。差別の歴史の核心として1分で。",0],
["E. 基礎知識","日本の「外国につながる子ども」の課題を知っていますか","不就学の問題、日本語指導が必要な児童生徒の増加。外国人には就学義務が適用されない、という制度の話まで言えると強い。",0],

["F. 将来・締め","10年後、どうなっていたいですか（将来のビジョン）","★「未定」で終わらせない答え方：①方向は決まっている（言葉や文化の違いで不利な立場に置かれた人の側に立つ）②候補も考えている（国際協力の現場／日本国内で外国につながる人を支える仕事）③大学4年間で現場と学問に触れて決める、という計画まで言う。迷いを「考え続けている証拠」として堂々と示す。",1],

const THEMES=JSON.parse("[{\"t\": \"難民・移民の受け入れと多文化共生\", \"why\": \"2026年度に実際に出題（「日本は難民・避難民を積極的に受け入れるべきか」450〜500字）。学部の看板テーマで、ことみの関心の中心。最有力。\", \"psg\": \"　難民や避難民の受け入れをめぐる議論には、二つの相反する論理がある。一つは「人権の論理」、もう一つは「主権の論理」である。\\n　人権の論理に立てば、迫害や紛争から逃れてきた人々を保護することは、国籍にかかわらず人間が等しく持つ権利にもとづく義務である。どの国に生まれたかは、本人が選んだことではない。この立場からは、受け入れは「してもよいこと」ではなく「しなければならないこと」となる。\\n　一方、主権の論理は、誰を国内に受け入れるかを決めるのは国家の固有の権限だと考える。国民の安全や雇用、社会保障を守る責任を負う国家が、受け入れの範囲を自ら決めるのは当然だという主張である。無制限の受け入れは社会の負担を増し、かえって国内の分断を招きかねない、と警戒する。\\n　日本の難民認定数は、欧米諸国に比べて著しく少ないことが長く指摘されてきた。ところが二〇二二年、ウクライナからの避難民については、国も自治体も企業も、住まいや仕事の提供にすばやく動いた。同じように紛争や迫害から逃れてきた他の地域の人々が、何年も認定を待たされている現実と比べると、この違いは何を意味するのだろうか。\\n　人権を重んじれば主権が制約され、主権を重んじれば救えたはずの命が救えなくなる。現実の政策は、この二つの論理のせめぎ合いの中にある。どちらか一方を選べば済む問題ではない。\\n　しかし忘れてはならないのは、この対立の根にあるのが、受け入れる側が相手をどう見るか、というまなざしの問題だということである。彼らを社会の「脅威」と見るのか、それとも共に社会を築く「隣人」と見るのか。ウクライナの例が示したのは、隣人と見た瞬間に、社会は驚くほど動けるということだった。同じ人々が、まなざし一つで、負担にも担い手にもなりうるのである。\", \"q1\": \"傍線部「同じ人々が、まなざし一つで、負担にも担い手にもなりうる」とはどういうことか、課題文に即して100字以内で説明しなさい。\", \"a1\": \"難民を社会の「脅威」と見れば国民の生活を圧迫する負担と映るが、共に社会を築く「隣人」と見れば社会を支える存在になるというように、受け入れる側の見方しだいで、同じ人々の位置づけが変わるということ。\", \"q2\": \"あなたは、日本は難民・避難民を積極的に受け入れるべきだと考えるか。課題文の「人権の論理」と「主権の論理」の両方に触れながら、あなたの考えを450〜500字で述べなさい。\", \"model\": \"私は、日本は難民・避難民を、受け入れの条件を整えながら、積極的に受け入れるべきだと考える。\\n\\n主権の論理が言うように、国には国民の暮らしを守る責任があり、準備のないまま受け入れれば、言葉や制度の壁から孤立や摩擦が生まれる。この懸念は現実的で、無視できない。\\n\\nしかし、人権の論理が示すとおり、命を守ることを国籍で線引きすることはできない。そして、主権の論理が挙げる不安の多くは、難民自身ではなく、受け入れる側の準備不足から生まれている。私はアメリカ留学の初め、英語がうまく話せず、ホストファミリーとの会話が続かなかった。だが下手でも自分から話しかけると、相手からも話しかけてくれるようになった。壁は、双方が歩み寄れば越えられる。難民の孤立も、日本語や就労の支援があれば、多くは防げるはずだ。\\n\\n課題文が挙げたウクライナの例は、相手を「隣人」と見たとき、日本社会が十分に動けることを証明した。その同じまなざしを、他の地域から逃れてきた人々にも向けるべきである。\\n\\n人権の論理を土台に置き、主権の論理が求める支援の仕組みを段階的に整える。人を助けることと社会を守ることは、対立ではなく両立できると私は考える。\\n\", \"points\": \"【問1のコツ】傍線部の「まなざし」「負担」「担い手」を、課題文の別の言葉（脅威／隣人／受け入れる側の見方）で言い換える。「AならばB、CならばD、というように〜ということ。」の対比の型。自分の意見は入れない。\\n【問2の鉄則】設問に「人権の論理と主権の論理の両方に触れながら」とある＝これは採点基準そのもの。模範では両方の語を各段落で明示的に使った（第2段落＝主権の論理を公平に認める／第3段落＝人権の論理を土台にする／最終段落＝両者の関係を一文で）。この語を使わずに書くと、内容が良くても大きく減点される。\\n【なぜこう書いたか】①立場を一文で明示 → ②反対側（主権の論理）を先に誠実に認める → ③しかし人権の論理＋「不安の多くは受け入れ側の準備不足」という自分の論点を、留学の経験で具体化 → ④課題文のウクライナの例を自分の主張の証拠として引用（課題文を「使う」姿勢を見せる）→ ⑤条件つきの結論。\\n【自分の武器】留学初期の会話が続かない経験→自分から話しかけた→相手も話しかけてくれた。この事実だけで「壁は双方が動けば越えられる」という論拠になる。\\n【注意】「かわいそうだから」で終わらせない。人道と社会の利益の両輪で。\", \"words\": \"問1＝100字以内／問2＝450〜500字（本番は大問2つ・90分）\", \"ul\": \"同じ人々が、まなざし一つで、負担にも担い手にもなりうる\"}, {\"t\": \"教育格差・メリトクラシー（能力主義）\", \"why\": \"2023年度に実際に出題（志水宏吉『ペアレントクラシー』＝親の富と子の将来）。明学レポートで学んだ『バイリンガルの壁』の知識と直結し、準備の相乗効果が大きい。\", \"psg\": \"　かつて社会は「メリトクラシー（能力主義）」を理想としてきた。生まれや身分ではなく、本人の努力と能力によって評価される社会は、公平で望ましいものと考えられた。\\n　だが近年、この理想には見えにくい落とし穴があることが指摘されている。教育社会学の調査は、親の収入が高い家庭ほど子どもの大学進学率が高いという傾向を、繰り返し確認してきた。塾に通えるか、家に本があるか、親が受験の情報を持ち、進路の相談相手になれるか。こうした条件は、子ども自身が選んだものではない。\\n　問題は、その差が「本人の努力の差」として扱われてしまうことにある。恵まれた環境で成果を上げた子は「頑張った人」として称賛され、そうでない子は「努力が足りなかった人」として自己責任を問われる。勝った側は自分の力を信じ、負けた側は自分を責める。しかし、努力できる条件そのものが、生まれた環境によって最初から不平等に配られているとしたら、その評価は本当に公平だといえるだろうか。\\n　しかも、この格差は目に見えにくい。身分制の時代には、生まれによる差別は誰の目にも明らかだった。だが能力主義のもとでは、差は「試験の点数」という一見公平な形をとって現れる。だからこそ、負けた側は不平等を訴えることさえ難しい。\\n　能力主義は、身分制よりは開かれた仕組みである。しかしそれが、環境の格差を覆い隠し、不平等を「自己責任」として正当化する装置になってしまうとき、私たちは立ち止まって考えなければならない。競争のルールが公平であることと、競争のスタートラインが公平であることは、別の問題なのである。\", \"q1\": \"傍線部「競争のルールが公平であることと、競争のスタートラインが公平であることは、別の問題」とはどういうことか、100字以内で説明しなさい。\", \"a1\": \"試験などの選抜が全員に同じ条件で行われていても、努力できる条件が家庭環境によって不平等に配られていれば、結果の差を本人の努力の差とは言えず、仕組みの公平さだけでは公平と呼べないということ。\", \"q2\": \"筆者は能力主義の「落とし穴」を指摘している。この問題に社会はどう向き合うべきか、あなたの考えを、具体例を挙げながら450〜500字で述べなさい。\", \"model\": \"筆者の言うとおり、能力主義の落とし穴は、環境の差を本人の努力の差にすり替えてしまう点にある。社会はこの差を「自己責任」で片づけず、スタートラインの差を埋める責任を引き受けるべきだと私は考える。\\n\\n私が特に深刻だと思うのは、言葉の壁による格差である。今年の春にグアテマラの学校でボランティアをし、帰国後に調べて、先住民の子どもの多くが家庭で話す言葉ではなくスペイン語で授業を受けていることを知った。日本でも、日本語の支援が必要な子どもが年々増えている。授業が分からない理由が言葉にあるのに、周りからは「勉強ができない子」に見えてしまう。選べない条件が、努力不足として扱われるのだ。\\n\\n社会がすべきことは二つある。一つは、学校の外で差を埋める仕組みを作ることだ。放課後の学習支援や日本語教室は、家庭が用意できない条件を社会が補う手段になる。もう一つは、点数だけでなく、その子が置かれた条件を見る目を持つことだ。\\n\\n格差を完全になくすことはできない。しかし「自己責任」という言葉で考えることをやめない社会であれば、能力主義は不平等を隠す装置ではなく、生まれによる不利を越える手段になりうると私は考える。\\n\", \"points\": \"【問1のコツ】「ルールの公平」＝選抜が同じ条件で行われること、「スタートラインの公平」＝努力できる条件の配分、と二つを分けて言い換える。「AであってもBでなければ〜ということ。」の型。\\n【問2の鉄則】設問は「社会はどう向き合うべきか」＋「具体例を挙げながら」。つまり①筆者の指摘への態度 ②具体例 ③対処、の三つが揃って初めて満点圏。模範では第1段落で筆者に賛成しつつ自分の主張を立て、第2段落で具体例、第3段落で対処を「二つある」と整理した。\\n【なぜこう書いたか】具体例に「言葉の壁による格差」を選んだのは、他の受験生が書けない自分だけの材料だから。ただし事実は正確に——グアテマラの現地で見たのではなく「帰国後に調べて知った」と書く。第4段落で「完全にはなくせない」と留保してから結論にすると、現実を見ている印象になる。\\n【自分の武器】グアテマラ→帰国後の調べ→先住民の子がスペイン語で授業。日本の日本語支援が必要な子の増加。『バイリンガルの壁』の生活言語／学習言語。\\n【注意】「努力の否定」に読まれないよう、必ず「努力できる条件の差」と書く。\", \"words\": \"問1＝100字以内／問2＝450〜500字（本番は大問2つ・90分）\", \"ul\": \"競争のルールが公平であることと、競争のスタートラインが公平であることは、別の問題\"}, {\"t\": \"言語・コミュニケーションと他者理解\", \"why\": \"2014年『ことばの発達の謎を解く』、2015年『つながりの哲学』など頻出領域。ことみの留学・複言語体験が最も生きるテーマ。\", \"psg\": \"　私たちはふだん、言葉が通じれば相手を理解できると考えている。しかし、言葉が通じることと、相手を理解することは、じつは同じではない。\\n　外国語を学び始めた人は、まず単語や文法を覚え、意味を正しく「翻訳」しようとする。だが、たとえ正しく訳せても、相手が本当に言いたかったことが伝わるとは限らない。言葉の背後には、その人が育った文化や歴史、その場の状況といった、言葉に表れない文脈があるからだ。同じ「大丈夫」という一語でも、それが承諾なのか遠慮なのか拒絶なのかは、文脈を読まなければ分からない。ある文化では沈黙が同意を意味し、別の文化では不満を意味することもある。\\n　むしろ、言葉が完璧に通じるという思い込みは、理解を妨げることさえある。「言葉が通じているのだから、分かり合えているはずだ」という前提が、相手の沈黙や、言いよどみや、表情に隠された本当の思いを見落とさせてしまう。理解できたと思った瞬間に、理解しようとする努力は止まるのである。\\n　だとすれば、他者を理解するとは、正しい言葉を並べることではない。相手がどんな背景を背負い、何を言おうとしているのかを想像し、分からなさに耐えながら、なお歩み寄ろうとすることである。理解とは、到達する地点ではなく、絶えず更新され続ける過程なのだ。\\n　このことは、外国語の場面に限らない。母語で話す家族や友人との間にも、同じ壁はある。言葉は、他者へ近づくための入り口にすぎない。その入り口をくぐった先で、私たちがどれだけ相手に想像力を働かせられるか。そこにこそ、理解の可能性がある。\", \"q1\": \"傍線部「言葉が完璧に通じるという思い込みは、理解を妨げることさえある」とはどういうことか、100字以内で説明しなさい。\", \"a1\": \"言葉の意味が正しく伝わっていると信じ込むと、もう分かり合えているはずだという前提が生まれ、相手の沈黙や表情に隠れた本当の思いや、言葉に表れない文脈を読み取ろうとする努力が止まってしまうということ。\", \"q2\": \"「他者を理解する」とはどういうことだと考えるか。あなた自身の経験を踏まえて、450〜500字で述べなさい。\", \"model\": \"筆者は、理解とは到達点ではなく歩み寄り続ける過程だと述べる。私も自分の経験から、他者を理解するとは、相手を分かろうとする姿勢を持ち続けることだと考える。\\n\\n十五歳でアメリカに留学した当初、私は英語がうまく話せず、ホストファミリーとの会話が続かなかった。頭の中で文法を組み立てているうちに話題は過ぎ、伝えたいのに伝わらない心細さを知った。\\n\\n転機は、完璧な英語をあきらめ、下手でも自分から話しかけると決めたことだった。すると相手からも話しかけてくれるようになり、少しずつ関係が生まれた。ここで順序が逆だと気づいた。言葉が通じるようになったから理解が生まれたのではない。分かろうとして歩み寄ったから、言葉が通じ始めたのだ。\\n\\n同じことを、グアテマラの学校で過ごした一週間でも感じた。私は最初、子どもたちを「助ける相手」として見ていた。だが一緒に過ごすうちに、彼らが何を大切にし、何に笑うのかを知ろうとしなければ、何も理解できないと気づいた。相手を対等な一人として見ることが、理解の出発点だった。\\n\\n理解は、言葉の量でも知識の量でも測れない。相手に近づこうとする意志を持ち続けることそのものが、理解なのだと私は考える。\\n\", \"points\": \"【問1のコツ】「思い込み」→「分かり合えているはずだという前提」、「理解を妨げる」→「隠れた思いや文脈を読み取る努力が止まる」と、課題文の第3段落の言葉で言い換える。因果（信じ込む→前提が生まれる→努力が止まる）を一文に。\\n【問2の鉄則】設問は「あなた自身の経験を踏まえて」。経験の「報告」で終わらず、経験から「理解とは何か」という原理を取り出すこと。模範は各経験の段落の最後に必ず「気づき＝一般化の一文」を置いている。\\n【なぜこう書いたか】課題文の言葉を丸写しせず、「筆者は〜と述べる。私も自分の経験から〜と考える」と、筆者に応答する形で始めた。第3段落の「順序が逆だった（歩み寄ったから言葉が通じ始めた）」は課題文に無い自分の発見——ここが採点者に「自分の頭で考えた」と伝わる箇所。第4段落のグアテマラで「助ける相手として見ていた自分」を反省するのは、志願者調書と同じ主張なので面接とも一貫する。\\n【自分の武器】ホストファミリーとの会話が続かない→自分から話す→相手からも。グアテマラで対等に見ることの気づき。\\n【注意】ここは独壇場。感情に流れず「だから何が言えるか」を必ず書く。\", \"words\": \"問1＝100字以内／問2＝450〜500字（本番は大問2つ・90分）\", \"ul\": \"言葉が完璧に通じるという思い込みは、理解を妨げることさえある\"}, {\"t\": \"グローバル化とローカル（グローカル）・地域社会\", \"why\": \"2016年『みんなのバカ』、2020年（格差・ポピュリズム）等で頻出。学部が掲げる「グローカル」の核。横浜という土地とも接続しやすい。\", \"psg\": \"　グローバル化は、世界を一つに近づけた。人・モノ・情報が国境を越えて行き交い、遠い国の出来事が、たちまち自分たちの暮らしに影響を及ぼすようになった。\\n　この変化を、地域の側から不安の目で見る人も少なくない。地域の産業が安価な海外製品との競争にさらされる。地域独自の文化が、世界共通の流行の中に埋もれていく。外から来た人々との間に摩擦が生じることもある。グローバル化は地域の固有性を溶かしてしまうのではないか、という懸念である。こうした不安が、「自分たちの地域を守れ」という内向きの声を強めている国も多い。\\n　しかし、世界と地域は、本当に対立するものだろうか。たとえば横浜市には、いまや十万人を超える外国人住民が暮らしている。彼らの子どもが通う学校、働く職場、住む町内会は、すべて「地域」そのものである。世界規模の人の移動という現象は、抽象的な統計としてではなく、隣の席の同級生や、同じ商店街の店主という、顔の見える形で地域に現れる。逆に、地域で起きている問題は、多くの場合、世界の動きと地続きである。抽象的な「世界」も、顔の見える「地域」も、同じ一つの現実の異なる側面にすぎない。\\n　だからこそ、いま求められているのは、世界的な視野で課題を捉えつつ、その解決を具体的な地域の現場で実践する姿勢である。地域の固有性は、外に対して閉じることで守られるのではない。むしろ、外から来たものを受け止め、自分たちの文化と混ぜ合わせていく力こそが、その地域の固有性を作ってきた。港町がそうであったように。\\n　世界を知ることは、地域を捨てることではない。世界と地域を往復する思考こそが、これからの社会を生きる鍵となる。\", \"q1\": \"傍線部「抽象的な「世界」も、顔の見える「地域」も、同じ一つの現実の異なる側面にすぎない」とはどういうことか、100字以内で説明しなさい。\", \"a1\": \"世界規模の人の移動は、統計としてではなく、同級生や商店主といった身近な人々の姿で地域に現れ、地域の問題も世界の動きとつながっているので、両者は一つの現実を違う角度から見たものだということ。\", \"q2\": \"グローバル化が進む中で、世界とのつながりと地域の固有性を、どのように両立させるべきか。あなたの考えを、具体例を挙げながら450〜500字で述べなさい。\", \"model\": \"私は、地域の固有性は外に閉じることではなく、外から来た人や文化を受け止める力によって守られると考える。両者は対立するものではなく、地域の固有性は世界とのつながりを通して育つのだ。\\n\\nきっかけは、今年の春、グアテマラの学校で一週間ボランティアをした経験だ。帰国後にこの国について調べ、先住民の子どもの多くが家庭で話す言葉ではなくスペイン語で授業を受けていることを知った。同時に、日本でも日本語の支援が必要な子どもが年々増えていることを知った。遠い国の問題だと思っていたことが、横浜の学校にも、形を変えて存在していた。これが、課題文の言う「地続き」ということだと思う。\\n\\nだとすれば、両立の方法は、世界の課題を自分の地域の現場で引き受けることだ。たとえば横浜の学校で、日本語に困る子どもの学習を支える活動に関わること。それは外国の子どもを「助ける」ことではなく、その子が地域の一員として育つことで、地域自体が豊かになる営みである。港町として育ってきた横浜には、その力があるはずだ。\\n\\n地域を守るとは、壁を作ることではない。世界を受け止め、自分たちの形に育てていくこと。それが両立の道だと私は考える。\\n\", \"points\": \"【問1のコツ】「同じ現実の異なる側面」＝世界の現象が身近な人の姿で地域に現れ、地域の問題も世界とつながっている、と課題文の横浜の例（同級生・商店主）を使って言い換える。「〜ので、両者は〜だということ。」の型。\\n【問2の鉄則】設問は「どのように両立させるべきか」＋「具体例」。「グローバル化は良い／悪い」の二択にせず、「両立の方法」を答える。模範は第1段落で「固有性は閉じることでなく受け止める力で守られる」という自分の答えを先に出した。\\n【なぜこう書いたか】課題文の主張をなぞるのではなく、自分の経験（グアテマラ→帰国後の調べ→横浜の学校にも同じ問題）で「地続き」を体験として証明し、「これが課題文の言う『地続き』だ」と課題文に接続した。第3段落で横浜の学校での活動という具体的な現場を出し、「助ける」ではなく「地域が豊かになる」と言い換えたのは、調書の「対等」の主張と一貫させるため。\\n【自分の武器】グアテマラと横浜の接続／港町横浜／将来この地域で関わりたいという志望理由。\\n【注意】横浜を出すのは学部への媚びではなく、「具体的な現場」を示すため。書くなら具体的に。\", \"words\": \"問1＝100字以内／問2＝450〜500字（本番は大問2つ・90分）\", \"ul\": \"抽象的な「世界」も、顔の見える「地域」も、同じ一つの現実の異なる側面にすぎない\"}, {\"t\": \"AI・データと社会（技術と人間・情報リテラシー）\", \"why\": \"2027年新カリキュラムの「文理融合・AIリテラシー」を反映して新規出題の可能性。近年の小論文全般で最頻出テーマの一つ。保険として必須。\", \"psg\": \"　人工知能（AI）の発達は、私たちの社会を大きく変えようとしている。膨大なデータを瞬時に分析し、最適な答えを示すAIは、医療や教育、防災など、さまざまな場面で人間の能力を超えつつある。もはやAIなしの社会は考えにくい。\\n　しかし、ここで立ち止まって考えたいことがある。AIが導く「答え」とは、いったい何か。それは、過去に蓄積されたデータをもとにした、確率的な予測にすぎない。つまり、多数派の傾向や、平均的なパターンを映し出したものである。\\n　このことは、思わぬ結果を生む。ある企業が採用の選考にAIを使ったところ、過去の採用データの偏りをそのまま学習し、特定の性別の応募者を低く評価していたことが明らかになった。AIは差別を「意図」したわけではない。過去の社会にあった偏りを、忠実に再現しただけである。効率を求めて導入した技術が、社会の不公平を自動化してしまったのだ。\\n　そこには、数字に表れにくいものが抜け落ちる危険がある。たとえば、ある地域の教育の状況を平均値だけで見れば、全体としては問題がないように見えるかもしれない。だが、その平均の陰に、支援を最も必要とする少数の子どもが隠れていることがある。AIが示す「全体としての正しさ」は、時に、最も助けを必要とする一人を見えなくしてしまう。\\n　だからこそ、AIを使う人間の側に、その答えをそのまま受け入れず、背景を問い直す力が求められる。この数字は誰を映し、誰を映していないのか。効率という尺度から、こぼれ落ちている人はいないか。技術を賢く使いこなすことと、数字の奥にいる一人ひとりの存在を忘れないこと。その両立こそが、これからの社会に不可欠な姿勢なのである。\", \"q1\": \"傍線部「AIが示す「全体としての正しさ」は、時に、最も助けを必要とする一人を見えなくしてしまう」とはどういうことか、100字以内で説明しなさい。\", \"a1\": \"AIの答えは過去のデータの多数派や平均を映した予測なので、全体としては妥当に見えても、平均から外れた少数の人の事情はデータに表れにくく、最も支援が必要な人ほど見落とされてしまうということ。\", \"q2\": \"AIをはじめとする技術と、人間はどのように向き合っていくべきか。あなたの考えを、具体例を挙げながら450〜500字で述べなさい。\", \"model\": \"私は、AIの答えを「結論」ではなく「仮説」として扱い、そこに映っていない人を問い続けることが、人間の役割だと考える。\\n\\n課題文の採用の例が示すように、AIは過去のデータを忠実に学ぶ。だから過去の社会に偏りがあれば、その偏りも忠実に再現する。恐ろしいのは、それが「データにもとづく客観的な判断」という顔をして現れることだ。人間の偏見なら疑えるが、数字の偏見は疑いにくい。\\n\\n私が関心を持つ教育の分野でも、同じことが起こりうる。学校の平均点だけを見れば問題がなくても、その中には、日本語の支援が必要で授業についていけない子どもがいるかもしれない。こうした子どもの困難は、平均には表れない。AIが「この学校は順調だ」と示したとき、その一人を見つけるのは人間の仕事である。\\n\\nだから、技術と向き合う姿勢は三つに集約されると思う。AIの答えを出発点として使うこと。「このデータには誰が入っていないか」を問うこと。そして最後の判断と責任を人間が引き受けることだ。\\n\\n技術を拒む必要はない。ただ、数字の奥にいる一人を見る目だけは、人間が手放してはならないと私は考える。\\n\", \"points\": \"【問1のコツ】「全体としての正しさ」＝多数派・平均を映した予測、「一人を見えなくする」＝平均から外れた少数の事情はデータに表れない、と因果で言い換える。「〜なので、〜てしまうということ。」の型。\\n【問2の鉄則】技術テーマは①便利さを否定しない ②限界を示す ③人間の役割、のバランス。設問の「具体例」は課題文の採用の例を使ってよい（課題文を根拠に使うのは減点ではなく加点）。ただし自分の例も一つ足す。\\n【なぜこう書いたか】第1段落で「AIの答えは結論ではなく仮説」という自分の言葉で主張を立てた（課題文の「そのまま受け入れず」の言い換えだが、自分の表現になっている）。第2段落「人間の偏見なら疑えるが、数字の偏見は疑いにくい」は課題文に無い一歩踏み込んだ指摘。第3段落で自分の関心（教育・日本語支援が必要な子）に引きつけ、第4段落で「三つ」に整理して読みやすくした。\\n【自分の武器】教育格差への関心／「数字の奥の一人」という見方（明学レポートとも共通）。グアテマラは無理に入れなくてよい——毎回入れると型にはまって見える。\\n【注意】AIの専門知識は不要。「便利さ＋落とし穴＋人間の判断」の型と姿勢で勝負。\", \"words\": \"問1＝100字以内／問2＝450〜500字（本番は大問2つ・90分）\", \"ul\": \"AIが示す「全体としての正しさ」は、時に、最も助けを必要とする一人を見えなくしてしまう\"}]");

function catOrder(c){return ["C","A","B","D","E","F"].indexOf(c[0]);}
function autoPickIds(){
const used=S.mock.used||{};
const byCat={};
QA.forEach((q,i)=>{const c=q[0][0];(byCat[c]=byCat[c]||[]).push(i);});
const pick=[];
Object.keys(byCat).forEach(c=>{
  const arr=byCat[c].slice().sort((a,b)=>{
    const ua=used[a]||0, ub=used[b]||0;
    if(ua!==ub) return ua-ub;
    const na=QA[a][3]?0:1, nb=QA[b][3]?0:1; // ★新を優先
    if(na!==nb) return na-nb;
    return Math.random()-0.5;});
  pick.push(arr[0]);
});
const rest=QA.map((_,i)=>i).filter(i=>!pick.includes(i)).sort((a,b)=>{
  const ua=used[a]||0, ub=used[b]||0;
  if(ua!==ub) return ua-ub;
  const na=QA[a][3]?0:1, nb=QA[b][3]?0:1;
  if(na!==nb) return na-nb;
  return Math.random()-0.5;});
pick.push(rest[0],rest[1]);
return pick;
}

return `<div class="log"><span class="d">${l.d}</span><span class="tag">${l.t}</span><span>${esc(l.m)}</span><button class="btn sm gray" onclick="delLog(${i})">削除</button></div>`;}).join("")||"<div class='small'>まだ記録がありません</div>";
return `<div class="card"><h2>練習・採点の記録</h2>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
<input type="date" id="ld" value="${new Date().toISOString().slice(0,10)}">
<select id="lt"><option>発表練習</option><option>質疑練習</option><option>模擬面接</option><option>小論文</option><option>その他</option></select>
<input type="text" id="lm" placeholder="メモ（例：小論文 テーマ2 22/30 講評済）" style="flex:1;min-width:200px">
<button class="btn" onclick="addLog()">追加</button></div>
${list}</div>`;
}

return `<div class="card"><h2>データ同期（自動）</h2>

/* ---------- behaviors ---------- */
function afterRender(){
const sc=document.getElementById("script");
if(sc){sc.addEventListener("input",()=>{S.script=sc.value;save();
const len=sc.value.replace(/\s/g,"").length;
document.getElementById("slen").textContent=len;
document.getElementById("smin").textContent=(len/300).toFixed(1);});}
const po=document.getElementById("poster");
if(po){po.addEventListener("input",()=>{S.poster=po.value;save();});}
const hn=document.getElementById("homeNotes");
if(hn){hn.addEventListener("input",()=>{S.notes=hn.value;save();});}
document.getElementById("ver").textContent=APP_VERSION;
document.querySelectorAll(".qa .qh").forEach(el=>{
  el.addEventListener("click",ev=>{
    if(ev.target.classList.contains("st"))return;
    el.parentElement.classList.toggle("open");});});
}
function qaSt(ev,i){ev.stopPropagation();S.qa[i]=((S.qa[i]||0)+1)%3;save();render();}
function themeChk(ev,i){ev.stopPropagation();S.themeChk=S.themeChk||{};S.themeChk[i]=!S.themeChk[i];save();render();}
function addLog(){const d=document.getElementById("ld").value,t=document.getElementById("lt").value,m=document.getElementById("lm").value.trim();
if(!m){alert("メモを入力してください");return;}
S.logs.push({d,t,m});save();render();}
function delLog(i){if(confirm("削除しますか？")){S.logs.splice(i,1);save();render();}}

/* ---------- timer ---------- */
let tSec=600,tRun=null,tCount=600;
function tFmt(s){const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");}
function tShow(){const d=document.getElementById("tdisp");if(!d)return;d.textContent=tFmt(tCount);d.className=tCount<=60?"warn":"";}
function tSet(s){tStop();tSec=s;tCount=s;tShow();}
function tGo(){if(tRun){tStop();return;}
document.getElementById("tgo").textContent="一時停止";
tRun=setInterval(()=>{tCount--;if(tCount<=0){tStop();tCount=0;tShow();document.title="⏰ 時間です";alert("時間です");return;}tShow();},1000);}
function tStop(){clearInterval(tRun);tRun=null;const b=document.getElementById("tgo");if(b)b.textContent="スタート";}
function tReset(){tStop();tCount=tSec;tShow();}

/* ---------- gist sync ---------- */
async function gistSave(){
const tk=document.getElementById("ghtoken").value.trim(),id=document.getElementById("ghgist").value.trim(),msg=document.getElementById("gmsg");
if(!tk||!id){msg.textContent="トークンとGist IDを入力";return;}
localStorage.setItem(GH_TOKEN_KEY,tk);localStorage.setItem(GH_GIST_KEY,id);
msg.textContent="保存中…";
try{const r=await fetch("https://api.github.com/gists/"+id,{method:"PATCH",headers:{Authorization:"token "+tk,"Content-Type":"application/json"},body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(S)}}})});
msg.textContent=r.ok?"✓ 保存しました "+new Date().toLocaleTimeString():"エラー: "+r.status;}catch(e){msg.textContent="通信エラー";}}
async function gistLoad(){
const tk=document.getElementById("ghtoken").value.trim(),id=document.getElementById("ghgist").value.trim(),msg=document.getElementById("gmsg");
if(!tk||!id){msg.textContent="トークンとGist IDを入力";return;}
localStorage.setItem(GH_TOKEN_KEY,tk);localStorage.setItem(GH_GIST_KEY,id);
msg.textContent="読込中…";
try{const r=await fetch("https://api.github.com/gists/"+id,{headers:{Authorization:"token "+tk}});
if(!r.ok){msg.textContent="エラー: "+r.status;return;}
const j=await r.json();const f=j.files&&j.files[GIST_FILE];
if(!f){msg.textContent="Gist内にv2データがまだありません（初回は先に保存を）";return;}
const o=JSON.parse(f.content);S=Object.assign(S,o);S.mock=Object.assign({sets:[],used:{},sel:{}},o.mock||{});
localStorage.setItem(KEY,JSON.stringify(S));
msg.textContent="✓ 読み込みました";render();}catch(e){msg.textContent="通信エラー";}}

/* ---------- export/import ---------- */
function expJson(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="kotomi-navi-v2-backup.json";a.click();}
function impJson(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);S=Object.assign(S,o);S.mock=Object.assign({sets:[],used:{},sel:{}},o.mock||{});localStorage.setItem(KEY,JSON.stringify(S));render();alert("読み込みました");}catch(e){alert("読み込み失敗");}};rd.readAsText(f);}

nav();render();initSync();
</script>
